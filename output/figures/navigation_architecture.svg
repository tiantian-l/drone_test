<text x="190" y="911" font-size="25" font-weight="bold" >Training only: experience replay and latent imagination</text>
<rect x="205" y="950" width="325" height="155" rx="18" fill="#efe7f7" stroke="#8965b2" stroke-width="2" />
<text x="367" y="985" font-size="24" font-weight="bold" text-anchor="middle">Replay Buffer</text>
<text x="229" y="1030" font-size="19"  >Observations, actions, rewards</text>
<text x="229" y="1063" font-size="19"  >and continuation indicators</text>
<rect x="605" y="950" width="405" height="155" rx="18" fill="#e4effc" stroke="#5591c8" stroke-width="2" />
<text x="807" y="985" font-size="24" font-weight="bold" text-anchor="middle">World-Model Learning</text>
<text x="628" y="1024" font-size="19"  >Train encoders, RSSM and predictors</text>
<text x="628" y="1057" font-size="19"  >Reconstruction, KL, reward</text>
<text x="628" y="1085" font-size="19"  >and continuation losses</text>
<rect x="1085" y="950" width="355" height="155" rx="18" fill="#e0f5f0" stroke="#32998a" stroke-width="2" />
<text x="1262" y="985" font-size="24" font-weight="bold" text-anchor="middle">Latent Imagination</text>
<text x="1110" y="1031" font-size="20"  >Roll out H-step trajectories</text>
<text x="1110" y="1066" font-size="20"  >in learned latent space</text>
<rect x="1515" y="950" width="470" height="155" rx="18" fill="#fff2df" stroke="#d79a43" stroke-width="2" />
<text x="1750" y="985" font-size="24" font-weight="bold" text-anchor="middle">Actor–Critic Learning</text>
<text x="1538" y="1031" font-size="20"  >Update actor from imagined returns</text>
<text x="1538" y="1066" font-size="20"  >Fit critic to return targets</text>
