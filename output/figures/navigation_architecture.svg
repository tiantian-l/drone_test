<rect width="2200" height="1250" fill="white"/><g font-family="Arial" fill="#172b46">
<text x="1100" y="58" font-size="38" font-weight="bold" text-anchor="middle">DreamerV3-based UAV Navigation Architecture</text>
<rect x="30" y="110" width="310" height="650" rx="18" fill="#f5f1fb" stroke="#8965b2" stroke-width="2" stroke-dasharray="8 5"/>
<text x="185" y="150" font-size="26" font-weight="bold" text-anchor="middle">Observations</text>
<circle cx="185" cy="282" r="94" fill="none" stroke="#a78bca" stroke-dasharray="5 5"/>
<g stroke="#a78bca" stroke-width="1.5">
<path d="M185 188V376M91 282H279M119 216L251 348M119 348L251 216M149 195L221 369M98 246L272 318M98 318L272 246M149 369L221 195"/>
</g>
