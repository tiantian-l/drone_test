<text x="185" y="410" font-size="22"  text-anchor="middle">360° horizontal LiDAR</text>
<text x="185" y="442" font-size="21"  text-anchor="middle">8 × 72 rays (576D)</text>
<text x="185" y="474" font-size="20"  text-anchor="middle">Ray-hit fractions in [0, 1]</text>
<rect x="49" y="530" width="272" height="200" rx="18" fill="#ffffff" stroke="#c7b7dd" stroke-width="2" />
<text x="185" y="567" font-size="23" font-weight="bold" text-anchor="middle">State vector (9D)</text>
<text x="185" y="610" font-size="20"  text-anchor="middle">Relative goal position (3D)</text>
<text x="185" y="649" font-size="20"  text-anchor="middle">World-frame velocity (3D)</text>
<text x="185" y="688" font-size="20"  text-anchor="middle">Roll, pitch, yaw (3D)</text>
<rect x="390" y="190" width="350" height="220" rx="18" fill="#e4effc" stroke="#5591c8" stroke-width="2" />
<text x="565" y="231" font-size="25" font-weight="bold" text-anchor="middle">LiDAR Encoder Branch</text>
<text x="412" y="274" font-size="20"  >Center: L_t − 0.5</text>
<text x="412" y="308" font-size="20"  >3 × azimuth CNN + circular padding</text>
<text x="412" y="342" font-size="20"  >RMSNorm + SiLU</text>
<text x="412" y="376" font-size="20" font-weight="bold" >LiDAR embedding: 512D</text>
<rect x="390" y="520" width="350" height="220" rx="18" fill="#e4effc" stroke="#5591c8" stroke-width="2" />
<text x="565" y="561" font-size="25" font-weight="bold" text-anchor="middle">State Encoder Branch</text>
<text x="412" y="603" font-size="20"  >Preprocess: symlog(x)</text>
<text x="412" y="637" font-size="20"  >2-layer MLP (128 units)</text>
<text x="412" y="671" font-size="20"  >RMSNorm + SiLU</text>
<text x="412" y="705" font-size="20" font-weight="bold" >State embedding: 128D</text>
<rect x="790" y="385" width="205" height="220" rx="18" fill="#e0f5f0" stroke="#32998a" stroke-width="2" />
<text x="892" y="425" font-size="25" font-weight="bold" text-anchor="middle">Concatenate</text>
<text x="892" y="470" font-size="20"  text-anchor="middle">[e_state, e_lidar]</text>
<text x="892" y="524" font-size="21"  text-anchor="middle">Observation</text>
<text x="892" y="557" font-size="20" font-weight="bold" text-anchor="middle">embedding: 640D</text>
<rect x="1045" y="190" width="380" height="550" rx="18" fill="#e0f5f0" stroke="#32998a" stroke-width="2" />
<text x="1235" y="230" font-size="26" font-weight="bold" text-anchor="middle">World Model</text>
<text x="1070" y="279" font-size="24" font-weight="bold" >RSSM</text>
<text x="1070" y="317" font-size="20"  >History + observation embedding</text>
<text x="1070" y="354" font-size="20"  >Deterministic recurrent state h_t</text>
<text x="1070" y="391" font-size="20"  >Discrete stochastic state z_t</text>
<text x="1070" y="478" font-size="24" font-weight="bold" >Decoders and predictors</text>
<text x="1070" y="521" font-size="20"  >Reconstruct LiDAR and state</text>
<text x="1070" y="558" font-size="20"  >Predict reward</text>
<text x="1070" y="595" font-size="20"  >Predict continuation probability</text>
<rect x="1480" y="190" width="250" height="220" rx="18" fill="#e4effc" stroke="#5591c8" stroke-width="2" />
<text x="1605" y="232" font-size="26" font-weight="bold" text-anchor="middle">Actor–Critic</text>
<text x="1503" y="277" font-size="20"  >Actor: policy network</text>
<text x="1503" y="311" font-size="20"  >Critic: value network</text>
<text x="1503" y="359" font-size="21"  >Input: (h_t, z_t)</text>
<rect x="1480" y="510" width="250" height="230" rx="18" fill="#fff2df" stroke="#d79a43" stroke-width="2" />
<text x="1605" y="552" font-size="26" font-weight="bold" text-anchor="middle">Action (4D)</text>
<text x="1605" y="598" font-size="22"  text-anchor="middle">[d_x, d_y, d_z, s]</text>
<text x="1605" y="650" font-size="22"  text-anchor="middle">Velocity direction</text>
<text x="1605" y="685" font-size="22"  text-anchor="middle">+ speed scale</text>
<rect x="1800" y="110" width="370" height="650" rx="18" fill="#f0f7fb" stroke="#4383a9" stroke-width="2" stroke-dasharray="8 5"/>
<text x="1985" y="151" font-size="25" font-weight="bold" text-anchor="middle">PyBullet Environment</text>
<text x="1985" y="189" font-size="25" font-weight="bold" text-anchor="middle">and Controller</text>
<text x="1985" y="237" font-size="21"  text-anchor="middle">PID closed-loop control</text>
<text x="1985" y="270" font-size="21"  text-anchor="middle">Motor RPM → UAV dynamics</text>
